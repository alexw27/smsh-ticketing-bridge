wechat_campaign_qr:
  card_title: "WeChat Mini Program QR"
  card_intro: "Scan this QR in WeChat to open the event Mini Program page with this campaign attached. Scene is id={eventId}&aci={campaignId}. Codes are optional."
  img_alt: "WeChat Mini Program QR code for this campaign"
  event_heading: "Event"
  scene_heading: "Scene"
  page_heading: "Mini Program page"
  open_image: "Open image"
  no_code: "Save the campaign first. The WeChat QR uses the event id and campaign id, not a checkout code."
  not_configured: "WeChat campaign QR codes are not configured. Target an event, and enable a WeChat MiniProgram connection (default slug wechat) with App ID and App Secret."
  not_configured_event: "Target this campaign at an event (or a price category of an event) to generate a WeChat Mini Program QR. The QR opens pages/event/event with scene id={eventId}&aci={campaignId}."
  not_configured_page: "Set MiniProgram event page path on the SmartShanghai integration (System → API / Integrations) to generate this QR."
  not_configured_credentials: "Enable a WeChat MiniProgram integration (default slug wechat) with App ID and MiniProgram App Secret. Do not use the wechat-scanner door MiniProgram unless campaigns should open that app."
  failed: "Could not generate the WeChat Mini Program QR: %message%"
