services:
    _defaults:
        autowire: true
        autoconfigure: true

    Smsh\TicketingBridge\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/SmshTicketingBridgeBundle.php'
            - '../src/Api/JoinOrganizationApiPayload.php'
            - '../src/Api/JoinOrganizationResult.php'
            - '../src/Api/WeChatMarketPhoneApiPayload.php'
            - '../src/Organization/OrganizationWeChatQrPanelView.php'
            - '../src/WeChat/WeChatPhoneNumber.php'
            - '../src/WeChat/WeChatPhoneNumberExchangeException.php'

    Smsh\TicketingBridge\Api\OrganizationLookup:
        alias: Smsh\TicketingBridge\Api\DoctrineOrganizationLookup

    Smsh\TicketingBridge\Campaign\WeChatEventAffiliatePromoterPayloadExtension:
        tags:
            - { name: app.ticketing.promoter_affiliate_payload_extension }

    # Consumer MiniProgram QRs use WeChat Pay credentials unless a WeChat integration slug is set.
